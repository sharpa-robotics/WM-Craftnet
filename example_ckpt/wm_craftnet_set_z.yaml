      normalize_advantage: true
      gamma: 0.99
      tau: 0.95
      learning_rate: 0.0001
      lr_schedule: adaptive
      schedule_type: standard
      kl_threshold: 0.02
      score_to_win: 100000
      max_epochs: ${resolve_default:20100,${....max_iterations}}
      save_best_after: ${..save_best_after}
      save_frequency: 5000
      print_stats: true
      grad_norm: 1.0
      entropy_coef: 0.0
      truncate_grads: true
      e_clip: 0.2
      horizon_length: 16
      minibatch_size: ${..tuning.minibatch_size}
      mini_epochs: 4
      critic_coef: 5
      clip_value: true
      seq_length: 4
      bptt_len: 16
      bounds_loss_coef: 0.005
      bc_loss_coef: 0.01
      weight_decay: 0.0
