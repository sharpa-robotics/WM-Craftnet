params:
  seed: ${...seed}
  # Common parallelism and batch parameters (edit here first)
  tuning:
    num_envs: 1024
    minibatch_size: 4096
  # Common checkpoint policy (placed at the top with tuning.num_envs for easy editing)
  save_best_after: 100
  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    pointnet: small
    moe:
      enabled: False
      num_experts: 6
      axis_obs_start: 49
      axis_obs_dim: 3
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

    mlp:
      units: [512, 256, 256]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: ${if:${...checkpoint},True,False}
  load_path: ${...checkpoint}

  config:
    name: ${resolve_default:AllegroArmMOA,${....experiment}}
    env_name: rlgpu
    prefix: ""
    user_prefix: "test"              # User-defined run name suffix
    multi_gpu: ${....multi_gpu}
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: ${..tuning.num_envs}
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.02
    score_to_win: 100000
    max_epochs: ${resolve_default:20100,${....max_iterations}}
    save_best_after: ${..save_best_after}
    save_frequency: 5000
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: ${..tuning.minibatch_size}         # Common tuning parameter: PPO minibatch
    mini_epochs: 4
    critic_coef: 5
    clip_value: True
    seq_length: 4
    bptt_len: 16
    bounds_loss_coef: 0.005
    bc_loss_coef: 0.01
    weight_decay: 0.0
    player_collect: False
    player:
      deterministic: True
      print_stats: True

    central_value_config:
      minibatch_size: ${...tuning.minibatch_size}       # Keep on the same scale as minibatch_size above
      mini_epochs: 4
      learning_rate: 5e-4
      lr_schedule: adaptive
      schedule_type: standard
      kl_threshold: 0.016
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [512, 512, 256, 256]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None
