  sim_dt: 0.01667
  control_frequency_inv: 6
  sine_freq_hz: 1.0
  duration_s: 12.0
  pre_position_settle_s: 1.0
  sim_offset_settle_control_steps: 4
  output_paths:
    real_data_dir: deploy/pd_real
    sim_tune_dir: deploy/pu_tune
  adaptive_perturb:
    init_ratio: 0.3
    min_ratio: 0.01
    max_ratio: 0.8
    shrink_factor: 0.9
    grow_factor: 1.25
    improve_hi: 0.05
    improve_lo: 0.005
    patience_rounds: 5
    warmup_rounds: 2
  metric_weights:
    phase: 1.0
    amplitude: 2.5
    state_mae: 1.5
  metric_scales:
    phase_rad: 0.35
    amplitude_rad: 0.10
    state_mae_rad: 0.08

